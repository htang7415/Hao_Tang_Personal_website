<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hao Tang — AI systems and software engineering. Open-source inference routing, selected projects and machine learning research."
    />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <title>Hao Tang</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.tailwindcss.com" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
            colors: {
              background: {
                light: '#f8fafc', // slate-50
                dark: '#020617', // slate-950
              },
              // Custom "Comfortable True Blue" Palette
              // Less violet than default Tailwind blue, more "tech/royal" blue.
              blue: {
                50: '#f0f7ff',
                100: '#e0effe',
                200: '#bae0fd',
                300: '#7cc5f8',
                400: '#36a6f1',
                500: '#0c8de4',
                600: '#0071e3', // Comfortable "Apple-style" Link Blue
                700: '#005bb7',
                800: '#004c97',
                900: '#064079',
                950: '#04284d',
              }
            }
          },
        },
      }
    </script>
    <!-- Syntax highlighting for code blocks -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
      media="(prefers-color-scheme: dark)"
    >
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
      media="(prefers-color-scheme: light)"
    >
    <style>
      .editorial-link { display: inline-flex; align-items: center; gap: .4rem; color: #005bb7; }
      .dark .editorial-link { color: #36a6f1; }
      .editorial-link:hover { text-decoration: underline; text-underline-offset: 4px; }
      .editorial-section { border-top: 1px solid #e2e8f0; padding-block: 2.5rem; scroll-margin-top: 7rem; }
      .dark .editorial-section { border-color: #1e293b; }
      .section-heading { font-size: 1.25rem; font-weight: 600; letter-spacing: -.02em; }
      :where(a, button, input, select, textarea):focus-visible { outline: 2px solid #0071e3; outline-offset: 5px; }
      .dark :where(a, button, input, select, textarea):focus-visible { outline-color: #7cc5f8; }
      @media (min-width: 768px) { .editorial-section { padding-block: 3rem; } }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto !important; } *, *::before, *::after { transition: none !important; animation: none !important; } }
      /* Smooth scrolling for anchor links */
      html {
        scroll-behavior: smooth;
      }
      body {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
    </style>
</head>
  <body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-500/30 leading-relaxed">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
