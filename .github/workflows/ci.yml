name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Website verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Repository hygiene
        run: npm run check:repo
      - name: Workflow tests
        run: python -m unittest discover -s tests -v
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Locked dependency installation
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Application tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Build smoke check
        run: npm run check:build
      - name: Record source revision
        if: always()
        run: |
          mkdir -p .artifacts
          git rev-parse HEAD > .artifacts/commit.txt
          git diff --exit-code HEAD
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/
          if-no-files-found: error
          retention-days: 7
